# Criterios valorador ex ante — app_institucional_v3 (v3.3)
# Suma de pesos: 100. No modificar pesos ni pistas sin recalibrar ejemplos (p. ej. Bruno).
# El código valida contra el respaldo interno; si hay divergencias, usa el respaldo.

